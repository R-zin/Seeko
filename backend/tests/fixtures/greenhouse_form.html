<!doctype html><html><body><form id="application_form" onsubmit="document.title='SUBMITTED';return false">
<label for="fn">First Name</label><input id="fn" name="first_name" required>
<label for="em">Email</label><input id="em" name="email" type="email" required>
<label for="cv">Resume/CV</label><input id="cv" name="resume" type="file" required>
<label for="auth">Are you legally authorized to work in the US?</label>
<select id="auth" name="auth" required><option value="">--</option><option>Yes</option><option>No</option></select>
<fieldset><legend>Will you require sponsorship?</legend><label><input type="radio" name="sp" value="y" required> Yes</label><label><input type="radio" name="sp" value="n"> No</label></fieldset>
<label for="why">Why do you want to work here?</label><textarea id="why" name="why" required></textarea>
<label><input type="checkbox" name="agree"> I agree to the privacy policy</label>
<button type="submit">Submit Application</button></form></body></html>
