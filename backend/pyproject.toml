[project]
name = "seeko-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "openai>=1.50", "playwright>=1.47",
  "pydantic>=2.8", "pydantic-settings>=2.4", "sqlalchemy>=2.0", "pypdf>=4.3",
  "mcp>=1.2,<2", "httpx>=0.27", "python-multipart>=0.0.9", "aiosqlite>=0.20",
  # Job search: LangGraph orchestration with Postgres persistence (jobs + graph checkpoints)
  "langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=3.0,<4", "psycopg[binary]>=3.2", "psycopg-pool>=3.2",
  "alembic>=1.13",
  "pgserver>=0.1.4",   # embedded PostgreSQL used when DATABASE_URL is not set
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["postgres: needs a real PostgreSQL (TEST_DATABASE_URL or the embedded pgserver)"]
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = []
