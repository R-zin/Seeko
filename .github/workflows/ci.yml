name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python deps
        working-directory: backend
        run: |
          uv venv --python 3.12 .venv
          uv pip install -e ".[dev]"
      - name: Install Chromium for Playwright
        working-directory: backend
        run: .venv/bin/playwright install --with-deps chromium
      - name: Install tectonic
        run: |
          curl -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
          tectonic --version
      - name: Cache tectonic bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-bundle-v1
      - name: Warm tectonic bundle
        run: |
          printf '\\documentclass{article}\\begin{document}hi\\end{document}' > /tmp/w.tex
          cd /tmp && tectonic w.tex
      - name: Tests
        working-directory: backend
        run: .venv/bin/python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: |
          npm ci
          npx tsc -b
          npx vite build
